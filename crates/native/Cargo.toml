[package]
name = "nodetto-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
serde_json = "1"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSString", "NSURL"] }
