[package]
name = "app"
version = "0.1.0"
description = "diagra desktop client"
edition = "2021"

homepage = "https://github.com/tacogips/diagra-app"
repository = "https://github.com/tacogips/diagra-app"
license = "MIT"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
