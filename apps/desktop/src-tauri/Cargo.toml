[package]
name = "app"
version = "0.4.0"
description = "nodetto desktop client"
edition = "2021"

homepage = "https://github.com/tacogips/nodetto-app"
repository = "https://github.com/tacogips/nodetto-app"
license = "MIT"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nodetto-native = { path = "../../../crates/native" }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
